}

message UpdateTenantResponse{
  bool success=1;
}

message UpdateDestinationRequest{
  Destination destination =1;
}

message UpdateDestinationResponse{
  bool success=1;
}

message UpdateTakeOffRequest{
  TakeOff take_off =1;
}

message UpdateTakeOffResponse{
  bool success=1;
}

message UpdateEnergyTransactionRequest{
  EnergyTransaction energy_transaction =1;
}

message UpdateEnergyTransactionResponse{
  bool success=1;
}


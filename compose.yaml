services:

  back_info:
    image: back_info:latest
    depends_on:
      psqlDB:
        condition: service_healthy
    ports:
      - 8083:8083

  back_rockets:
    image: back_cohetes:latest
    depends_on:
      psqlDB:
        condition: service_healthy
    ports:
      - 8081:8081

  back_satelites:
    image: back_satelites:latest
    depends_on:
      psqlDB:
        condition: service_healthy
    ports:
      - 8082:8082
      
  psqlDB:
    image: postgres:18.6-alpine3.24
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "dyson_rings"
    volumes:
    - postgres_data:/var/lib/postgresql
    - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:




services:

  consul:
    image: hashicorp/consul:latest
    container_name: consul
    command: "agent -dev -client=0.0.0.0 -ui"
    ports:
      - "8500:8500"   # HTTP API + web UI: http://localhost:8500/ui
    networks:
      - microservices-net


  back-info-1:
    build:
      context: .
      dockerfile: back_info/Dockerfile
    environment:
      - INSTANCE_ID=back-info-1
      - CONSUL_HTTP_ADDR=http://consul:8500
    depends_on:
      psqlDB:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
     - microservices-net

  back-info-2:
    build: 
      context: .
      dockerfile: back_info/Dockerfile
    environment:
      - INSTANCE_ID=back-info-2
      - CONSUL_HTTP_ADDR=http://consul:8500
    depends_on:
      psqlDB:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
     - microservices-net

  back-info-3:
    build: 
      context: .
      dockerfile: back_info/Dockerfile
    environment:
      - INSTANCE_ID=back-info-3
      - CONSUL_HTTP_ADDR=http://consul:8500
    depends_on:
      psqlDB:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
     - microservices-net


  back-rockets-1:
    build: 
      context: .
      dockerfile: back_cohetes/Dockerfile
    environment:
      - INSTANCE_ID=back-rockets-1
      - CONSUL_HTTP_ADDR=http://consul:8500
    depends_on:
      psqlDB:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
     - microservices-net

  back-rockets-2:
    build: 
      context: .
      dockerfile: back_cohetes/Dockerfile
    environment:
      - INSTANCE_ID=back-rockets-2
      - CONSUL_HTTP_ADDR=http://consul:8500
    depends_on:
      psqlDB:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
     - microservices-net

  back-rockets-3:
    build: 
      context: .
      dockerfile: back_cohetes/Dockerfile
    environment:
      - INSTANCE_ID=back-rockets-3
      - CONSUL_HTTP_ADDR=http://consul:8500
    depends_on:
      psqlDB:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
     - microservices-net

  back-satelites-1:
    build:
      context: .
      dockerfile: back_satelites/Dockerfile
    environment:
      - INSTANCE_ID=back-satelites-1
      - CONSUL_HTTP_ADDR=http://consul:8500
    depends_on:
      psqlDB:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
     - microservices-net


  back-satelites-2:
    build:
      context: .
      dockerfile: back_satelites/Dockerfile
    environment:
      - INSTANCE_ID=back-satelites-2
      - CONSUL_HTTP_ADDR=http://consul:8500
    depends_on:
      psqlDB:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
     - microservices-net


  back-satelites-3:
    build:
      context: .
      dockerfile: back_satelites/Dockerfile
    environment:
      - INSTANCE_ID=back-satelites-3
      - CONSUL_HTTP_ADDR=http://consul:8500
    depends_on:
      psqlDB:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
     - microservices-net


  nginx-gateway:
    build: ./nginx
    environment:
      - CONSUL_HTTP_ADDR=consul:8500
    ports:
    - "8000:8000"
    - "8001:8001"
    - "8002:8002"
    - "8003:8003"

    depends_on:
      back-info-1:
        condition: service_started
      back-info-2:
        condition: service_started
      back-info-3:
        condition: service_started

      back-rockets-1:
        condition: service_started
      back-rockets-2:
        condition: service_started
      back-rockets-3:
        condition: service_started

      back-satelites-1:
        condition: service_started
      back-satelites-2:
        condition: service_started
      back-satelites-3:
        condition: service_started
      consul:
        condition: service_started

      psqlDB:
        condition: service_healthy

    networks:
      - microservices-net
      
  psqlDB:
    image: postgres:18.6-alpine3.24
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "dyson_rings"
    volumes:
    - postgres_data:/var/lib/postgresql
    - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - microservices-net

volumes:
  postgres_data:

networks:
  microservices-net:
    driver: bridge




services:

  consul:
    image: hashicorp/consul:latest
    container_name: consul
    command: "agent -dev -client=0.0.0.0 -ui"
    ports:
      - "8500:8500"   # HTTP API + web UI: http://localhost:8500/ui
    networks:
      - microservices-net


  back-info-1:
    build:
      context: .
      dockerfile: back_info/Dockerfile
    environment:
      - INSTANCE_ID=back-info-1
      - CONSUL_HTTP_ADDR=http://consul:8500
    depends_on:
      psqlDB:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
     - microservices-net

  back-info-2:
    build: 
      context: .
      dockerfile: back_info/Dockerfile
    environment:
      - INSTANCE_ID=back-info-2
      - CONSUL_HTTP_ADDR=http://consul:8500
    depends_on:
      psqlDB:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
     - microservices-net

  back-info-3:
    build: 
      context: .
      dockerfile: back_info/Dockerfile
    environment:
      - INSTANCE_ID=back-info-3
      - CONSUL_HTTP_ADDR=http://consul:8500
    depends_on:
      psqlDB:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
     - microservices-net


  back-rockets-1:
    build: 
      context: .
      dockerfile: back_cohetes/Dockerfile
    environment:
      - INSTANCE_ID=back-rockets-1
      - CONSUL_HTTP_ADDR=http://consul:8500
      - KAFKA_BROKER=kafka:9092
    depends_on:
      psqlDB:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
     - microservices-net

  back-rockets-2:
    build: 
      context: .
      dockerfile: back_cohetes/Dockerfile
    environment:
      - INSTANCE_ID=back-rockets-2
      - CONSUL_HTTP_ADDR=http://consul:8500
      - KAFKA_BROKER=kafka:9092
    depends_on:
      psqlDB:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
     - microservices-net

  back-rockets-3:
    build: 
      context: .
      dockerfile: back_cohetes/Dockerfile
    environment:
      - INSTANCE_ID=back-rockets-3
      - CONSUL_HTTP_ADDR=http://consul:8500
      - KAFKA_BROKER=kafka:9092
    depends_on:
      psqlDB:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
     - microservices-net

  back-satelites-1:
    build:
      context: .
      dockerfile: back_satelites/Dockerfile
    environment:
      - INSTANCE_ID=back-satelites-1
      - CONSUL_HTTP_ADDR=http://consul:8500
      - KAFKA_BROKER=kafka:9092
    depends_on:
      psqlDB:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
     - microservices-net


  back-satelites-2:
    build:
      context: .
      dockerfile: back_satelites/Dockerfile
    environment:
      - INSTANCE_ID=back-satelites-2
      - CONSUL_HTTP_ADDR=http://consul:8500
      - KAFKA_BROKER=kafka:9092
    depends_on:
      psqlDB:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
     - microservices-net


  back-satelites-3:
    build:
      context: .
      dockerfile: back_satelites/Dockerfile
    environment:
      - INSTANCE_ID=back-satelites-3
      - CONSUL_HTTP_ADDR=http://consul:8500
      - KAFKA_BROKER=kafka:9092
    depends_on:
      psqlDB:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
     - microservices-net


  nginx-gateway:
    build: ./nginx
    environment:
      - CONSUL_HTTP_ADDR=consul:8500
    ports:
    - "8000:8000"
    - "8001:8001"
    - "8002:8002"
    - "8003:8003"

    depends_on:
      back-info-1:
        condition: service_started
      back-info-2:
        condition: service_started
      back-info-3:
        condition: service_started

      back-rockets-1:
        condition: service_started
      back-rockets-2:
        condition: service_started
      back-rockets-3:
        condition: service_started

      back-satelites-1:
        condition: service_started
      back-satelites-2:
        condition: service_started
      back-satelites-3:
        condition: service_started
      consul:
        condition: service_started

      psqlDB:
        condition: service_healthy

    networks:
      - microservices-net
      
  cohete-consumer:
    build:
      context: .
      dockerfile: cohetes_consumer/Dockerfile
    environment:
      - INSTANCE_ID=cohete-consumer
      - CONSUL_HTTP_ADDR=http://consul:8500
      - KAFKA_BROKER=kafka:9092
    depends_on:
      psqlDB:
        condition: service_healthy
      kafka:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - microservices-net

  satelite-consumer:
    build:
      context: .
      dockerfile: satelites_consumer/Dockerfile
    environment:
      - INSTANCE_ID=satelite-consumer
      - CONSUL_HTTP_ADDR=http://consul:8500
      - KAFKA_BROKER=kafka:9092
    depends_on:
      psqlDB:
        condition: service_healthy
      kafka:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - microservices-net
  psqlDB:
    image: postgres:18.6-alpine3.24
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "dyson_rings"
    volumes:
    - postgres_data:/var/lib/postgresql
    - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - microservices-net

  kafka:
      image: apache/kafka:3.8.0
      container_name: kafka
      ports:
        - "9092:9092"
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      healthcheck:
        test:
          [
            "CMD-SHELL",
            "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 || exit 1",
          ]
        interval: 30s
        timeout: 10s
        retries: 5
        start_period: 60s

      networks:
        - microservices-net


volumes:
  postgres_data:

networks:
  microservices-net:
    driver: bridge



